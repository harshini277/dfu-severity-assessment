project:
  name: dfu-severity-assessment
  seed: 42

data:
  root: data/raw
  train_dir: train
  valid_dir: valid
  test_dir: test

  image_size: 224
  num_classes: 4

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001

model:
  architecture: resnet18
  pretrained: true
  ordinal_method: coral

evaluation:
  metrics:
    - accuracy
    - macro_f1
    - quadratic_weighted_kappa